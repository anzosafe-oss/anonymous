<style>
:root{font:16px/1.45 system-ui,sans-serif;color-scheme:dark;--bg:#0b1425;--panel:#111e32;--edge:#293950;--text:#fff;--muted:#a8b6cc;--red:#bd1733;--blue:#2163bf}
:root.light{color-scheme:light;--bg:#edf2fa;--panel:#fff;--edge:#c8d5e6;--text:#111e32;--muted:#475d78}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg);min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--edge);border-radius:10px;background:var(--panel);color:var(--text);padding:.64rem .85rem;min-height:44px}button:hover{border-color:#5887c4}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #609ffc;outline-offset:2px}.primary{background:var(--red);color:#fff;border-color:transparent;font-weight:750}.muted,small{color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.065em;line-height:1.06}h2{font-size:1.45rem;letter-spacing:-.035em}a{color:inherit}.stripe{height:4px;background:#ad1733 linear-gradient(105deg,#e1263d 0 43%,#fff 43% 56%,#2163bf 56%)}.brand{display:flex;gap:13px;align-items:center}.wordmark{font-size:1.26rem;font-weight:950;letter-spacing:-.065em;white-space:nowrap}.wordmark b{color:#ec4056}.wordmark i{color:#5a9cf2}.signature{display:block;font-size:.72rem;letter-spacing:.055em;color:var(--muted)}.pole{display:inline-block;width:14px;height:34px;border-block:4px solid #cad8ed;border-radius:5px;background:repeating-linear-gradient(-33deg,#e1263d 0 6px,#fff 6px 12px,#2163bf 12px 18px,#fff 18px 24px);box-shadow:inset -3px 0 #07101c3b;flex:none}
.login{width:min(100% - 32px,1000px);min-height:calc(100dvh - 4px);margin:auto;display:grid;grid-template-columns:1.15fr 1fr;align-content:center;padding-block:28px}.portrait{min-height:540px;border-radius:22px 0 0 22px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:36px;overflow:hidden;background:#111e32 center/cover;color:white}.portrait .signature{color:#e0e8f5}.portrait h1{font-size:clamp(2rem,5vw,4.1rem)}.eyebrow{font-size:.77rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:760}.portrait .eyebrow{color:#e0e8f5;margin-bottom:10px}.login-card{padding:clamp(22px,4vw,48px);border:1px solid var(--edge);border-radius:0 22px 22px 0;background:var(--panel);display:grid;align-content:center;gap:16px}.login-card form,.stack{display:grid;gap:14px}.login-card button{width:100%}.demo{font-size:.85rem;padding:12px;border-radius:10px;background:var(--bg);color:var(--muted)}label{display:grid;gap:5px;font-weight:620;font-size:.88rem}input,select,textarea{min-width:0;width:100%;padding:10px;color:var(--text);background:var(--bg);border:1px solid var(--edge);border-radius:9px;min-height:44px}.field-action{display:flex;gap:6px}.field-action button{width:auto}.error{color:#ff7a89;font-weight:650;font-size:.9rem}.light .error{color:#a8162e}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--edge)}.header-inner{max-width:1250px;margin:auto;padding:13.2px 26px;display:flex;align-items:center;justify-content:space-between;gap:10px}.identity{text-align:right}.identity strong{display:block}.frame{max-width:1250px;margin:auto;display:grid;grid-template-columns:178px minmax(0,1fr);gap:32px;padding:26px}.nav{display:flex;flex-direction:column;gap:7px;align-self:start;position:sticky;top:92px}.nav button{text-align:left;background:transparent;border-color:transparent}.nav .primary{background:var(--red);text-align:center;margin:6px 0;border-color:transparent}.nav small{padding:10px}.nav .symbol{display:none}.content{min-width:0;display:grid;gap:18px;align-content:start}.title-row,.section-top,.day-controls,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.title-row .eyebrow{margin-bottom:8px}.title-row p{margin-top:7px}.stats{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px}.tile,.panel{background:var(--panel);border:1px solid var(--edge);border-radius:15px;padding:16px}.tile strong{display:block;font-size:1.18rem;margin-top:4px}.tile:first-child{border-top:2px solid #e1263d}.tile:nth-child(2){border-top:2px solid #2163bf}.section-top{margin-bottom:12px}.section-top h2{font-size:1.17rem}.timeline{position:relative;margin-left:51px;border-left:1px solid var(--edge);background:repeating-linear-gradient(to bottom,transparent 0 95px,var(--edge) 95px 96px);margin-top:17px}.hour{position:absolute;right:calc(100% + 8px);transform:translateY(-40%);white-space:nowrap;color:var(--muted);font-size:.77rem}.slot,.block,.booking{position:absolute;left:5px;right:4px;padding:0 8px;border-radius:5px}.slot{min-height:0;border:0;background:transparent;color:transparent;text-align:left}.slot{-webkit-tap-highlight-color:transparent}.slot:focus-visible{background:#2163bf26;color:var(--text)}@media(hover:hover) and (pointer:fine){.slot:hover{background:#2163bf26;color:var(--text)}}.block{background:repeating-linear-gradient(135deg,transparent 0 5px,#849bb127 5px 6px);font-size:.75rem;color:var(--muted);overflow:hidden}.booking{text-align:left;min-height:0;display:flex;align-items:center;gap:8px;overflow:hidden;background:#173766;color:white;border:0;border-left:3px solid #1c6efe;white-space:nowrap}.booking:nth-of-type(even){background:#622338;border-color:#fd2a2e}.booking strong{overflow:hidden;text-overflow:ellipsis}.booking small{color:#e2ecff;overflow:hidden;text-overflow:ellipsis}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week button{display:grid;justify-items:center;padding:8px 2px}.week .active{border-color:#6497ea;background:#2163bf36}.history-row{padding:9px 0;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;align-items:center;gap:8px}.history-row:last-child{border:0}.settings-grid,.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.schedule{display:grid;grid-template-columns:minmax(80px,1fr) 1fr 1fr;gap:7px;align-items:center}.check{display:flex;align-items:center}.check input{width:16px;min-height:16px;height:16px}.settings-grid h2{margin-bottom:9px}.settings-grid textarea{min-height:100px}dialog{width:min(calc(100% - 24px),520px);max-height:92dvh;overflow:auto;border:1px solid var(--edge);border-radius:18px;padding:20px;background:var(--panel);color:var(--text)}dialog::backdrop{background:#030814b8}.danger{color:#ff8295}.toast{position:fixed;z-index:10;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:12px 16px;box-shadow:0 5px 28px #0004}

@media(max-width:650px){.login{display:block;padding-block:16px}.portrait{min-height:195px;padding:20px;border-radius:18px 18px 0 0}.portrait h1{font-size:2.35rem}.login-card{border-radius:0 0 18px 18px;gap:12px}.header-inner{padding:8.8px 12px}.identity small{display:none}.identity{font-size:.85rem}.header-inner>button{padding:5px 8px}.frame{display:block;padding:15px 12px calc(88px + env(safe-area-inset-bottom))}.content{gap:12px}.nav{position:fixed;z-index:6;inset:auto 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:5px 5px calc(5px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--edge)}.nav button,.nav .primary{text-align:center;margin:0;padding:2px;font-size:.73rem}.nav .symbol{display:block;font-size:1.16rem;line-height:1}.nav small{display:none}.tile,.panel{padding:10px}.tile small{font-size:.75rem}.tile strong{font-size:.95rem}.stats{gap:5px}.settings-grid{grid-template-columns:1fr}.toast{bottom:75px}.booking{gap:5px;padding-inline:5px;font-size:.83rem}.title-row .primary{padding:.55rem}.portrait .eyebrow{margin-top:15px}}

let profile, accountEmail, recovery = false;
const durations = [15,30,45,60,75,90];
const days = ['Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă','Duminică'];
const options = (items, selected) => items.map(([v,l])=>'<option value="'+safe(v)+'" '+(String(v)===String(selected)?'selected':'')+'>'+safe(l)+'</option>').join('');
let user, model, screen='today', day=today, weekly=false, toastTimer;
function defaultPrefs(){
  return {duration:45,services:'Tuns\nBarbă\nTuns + barbă',theme:'dark',
    hours:days.map((_,i)=>({open:i<6,start:'09:00',end:'18:00'})), pauses:'13:00–14:00',off:''};
}
async function loadAccount(session,{refresh=false}={}){
  const id=session.user.id;
  const access=await database.rpc('visit');
  if(access.error){await authClient.auth.signOut({scope:'local'});throw new Error('Accesul la agenda Anonimous nu este activ sau nu poate fi verificat. Contactează administratorul.');}
  const {data, error}=await database.from('profiles').select('display_name,alias,settings').eq('user_id',id).maybeSingle();
  if(error) throw new Error('Agenda nu s-a putut încărca. Încearcă din nou.');
  if(!data){
    await authClient.auth.signOut({scope:'local'});
    throw new Error('Contul nu are acces la agenda Anonymous.');
  }
  const {data: bookings,error: bookingError}=await database.from('appointments')
    .select('id,day,start_minute,duration,client,phone,service,notes,status').eq('user_id',id);
  if(bookingError) throw new Error('Programările nu s-au putut încărca.');
  if(refresh && (user!==id || modal.open || settingsDirty))return false;
  const scrollTop=refresh ? app.querySelector('.frame')?.scrollTop || 0 : 0;
  user=id;profile=data;accountEmail=session.user.email;
  model={prefs:{...defaultPrefs(),...profile.settings,name:profile.alias},bookings:bookings.map(({day,start_minute,...rest})=>({...rest,date:day,start:start_minute}))};
  today=currentDay();
  if(!refresh){screen='today';day=today;weekly=false;restoreUpdatedView(id)}
  if(screen==='today')day=today;
  render();
  app.querySelector('.frame').scrollTop=scrollTop;
  return true;
}
function showPasswordForm(isRecovery){
  openDialog('<form class="stack"><h2>Setează parola</h2><label>Parolă nouă<input type="password" name="password" autocomplete="new-password" required></label><label>Confirmă parola<input type="password" name="confirmation" autocomplete="new-password" required></label><p class="error" role="alert"></p><button class="primary">Salvează parola</button><button type="button" data-close>Închide</button></form>');
  const form=modal.querySelector('form');
  form.onsubmit=async e=>{
    e.preventDefault();
    const values=new FormData(form);
    const password=values.get('password');
    const alert=form.querySelector('.error');
    if(password!==values.get('confirmation')){alert.textContent='Parolele nu coincid.';return}
    e.submitter.disabled=true;
    try {
      const {error}=await authClient.auth.updateUser({password});
      if(error){alert.textContent='Parola nu a putut fi schimbată. Încearcă o parolă diferită sau cere un link nou.';return}
      if(isRecovery){
        recovery=false;
        await authClient.auth.signOut({scope:'local'});
        modal.close();login();notice('Parola a fost salvată. Conectează-te din nou.');
      } else {modal.close();notice('Parola a fost salvată.')}
    } finally {e.submitter.disabled=false}
  };
}
function notice(text){toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2700)}

function login(){
  delete document.body.dataset.stripe;
  app.classList.remove('agenda-shell');
  settingsDirty=false;
  document.documentElement.className='';
  document.querySelector('meta[name="theme-color"]').content='#0b1425';
  app.innerHTML='<main class="login"><div class="portrait">'+brand+'</div><section class="login-card"><h2>Autentificare</h2><form id="login"><label>E-mail<input name="user" type="email" autocomplete="username" required></label><label>Parolă<span class="field-action"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="visibility">Arată</button></span></label><div class="error" role="alert"></div><button class="primary">Intră în agendă</button></form><button id="recover">Recuperează parola</button></section></main>';
  const form=document.querySelector('#login');
  document.querySelector('#visibility').onclick=e=>{const field=form.password;field.type=field.type==='password'?'text':'password';e.target.textContent=field.type==='password'?'Arată':'Ascunde'};
  form.onsubmit=async e=>{
    e.preventDefault();
    const fields=new FormData(form);
    const alert=form.querySelector('.error');
    if(!authClient){alert.textContent='Serviciul de autentificare nu s-a încărcat.';return}
    e.submitter.disabled=true; alert.textContent='';
    try {
      const {data,error}=await authClient.auth.signInWithPassword({email:String(fields.get('user')).trim(),password:String(fields.get('password'))});
      if(error || !data.session){alert.textContent='Verifică adresa de e-mail și parola.';return}
      await loadAccount(data.session);
    } catch(error){alert.textContent=error.message}
    finally {e.submitter.disabled=false}
  };
  document.querySelector('#recover').onclick=()=>{
    openDialog('<form class="stack"><h2>Recuperare parolă</h2><label>Adresă de e-mail<input name="email" type="email" required></label><p class="error" role="alert"></p><button class="primary">Trimite linkul</button><button type="button" data-close>Închide</button></form>');
    const form=modal.querySelector('form');
    form.onsubmit=async e=>{
      e.preventDefault();
      if(!authClient){form.querySelector('.error').textContent='Serviciul de autentificare nu s-a încărcat.';return}
      e.submitter.disabled=true;
      try {
        const {error}=await authClient.auth.resetPasswordForEmail(form.email.value.trim(),{redirectTo:appUrl});
        if(error){form.querySelector('.error').textContent='Cererea nu s-a putut trimite. Încearcă din nou.';return}
        modal.close();notice('Dacă adresa este asociată unui cont, vei primi un link de resetare.');
      } finally {e.submitter.disabled=false}
    };
  };
}
const parts = text => text.split('\n').map(s=>s.trim()).filter(Boolean);
const overlap = (start,end,a,b) => start < b && end > a;
function intervals(date) {
  const hours=model.prefs.hours[weekday(date)];
  const closed=!hours.open || parts(model.prefs.off).some(line=>{
    const [first,last=first]=line.split(/\s*\/\s*/);
    return date>=first && date<=last;
  });
  const start=minutes(hours.start),end=minutes(hours.end);
  const parse=line=>line.split(/[–-]/).map(s=>minutes(s.trim()));
  const blocked=parts(model.prefs.pauses).map(line=>[...parse(line),'Pauză']);
  return {closed,start,end,blocked};
}
function daily(date){return model.bookings.filter(b=>b.date===date && b.status==='active').sort((a,b)=>a.start-b.start)}
function currentMinute(){return minutes(new Intl.DateTimeFormat('ro-RO',{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()))}
function overlapsBreak(work,start,end){
  return work.blocked.some(([a,b])=>overlap(start,end,a,b));
}
function outsideHours(work,start,end){
  return start<work.start||end>work.end;
}
function allowed(date,start,end,id,{allowExceptions=false}={}){
  const work=intervals(date);
  return !work.closed && start>=0 && end<=1440 &&
    (allowExceptions||(!outsideHours(work,start,end)&&!overlapsBreak(work,start,end))) &&
    !daily(date).some(b=>b.id!==id && overlap(start,end,b.start,b.start+b.duration));

function freeRanges(date) {

  if(work.closed)return ranges;

    if(!allowed(date,t,t+15))continue;
    if(ranges.at(-1)?.[1]===t)ranges.at(-1)[1]=t+15;
    else ranges.push([t,t+15]);
  }
  return ranges;
}

function bindTimeSlot(button){
  const frame=button.closest('.frame');
  let touch=null;
  button.addEventListener('pointerdown',event=>{
    touch=event.pointerType==='touch'
      ? {x:event.clientX,y:event.clientY,scrollTop:frame.scrollTop,cancelled:false}
      : null;
  });
  function trackMovement(event){
    if(touch && Math.hypot(event.clientX-touch.x,event.clientY-touch.y)>8)touch.cancelled=true;
  }
  button.addEventListener('pointermove',trackMovement);
  button.addEventListener('pointerup',trackMovement);
  button.addEventListener('pointercancel',()=>{if(touch)touch.cancelled=true});
  button.onclick=event=>{
    const open=()=>editor(null,Number(button.dataset.time));
    if(event.detail===0||!touch){open();return}
    const tap=touch;
    if(tap.cancelled)return;

function timeline(bookings,work){

  let html='<div class="timeline" style="height:'+((to-from)*scale)+'px">';
  for(let t=from;t<to;t+=60)html+='<span class="hour" style="top:'+((t-from)*scale)+'px">'+time(t)+'</span>';
  const bands=work.closed?[[from,to,'Zi liberă']]:[[from,work.start,'Închis'],[work.end,to,'Închis'],...work.blocked];
  for(const [a,b,label] of bands){
    const first=Math.max(from,a),last=Math.min(to,b);

  }

    html+='<button class="booking'+(outside?' outside-hours':inBreak?' in-break':'')+'"'+(exception?' title="'+exception+'"':'')+' data-booking="'+safe(b.id)+'"'+position(b.start,b.start+b.duration)+'><small>'+time(b.start)+'–'+time(b.start+b.duration)+'</small><strong>'+safe(b.client)+'</strong><small>'+safe(b.service)+(exception?' · '+exception:'')+'</small></button>';
  }
  return html+'</div>';
}

    row.className='stack';
    row.innerHTML='<div class="field-grid"><label>De la<input name="leaveFrom" placeholder="zz.ll.aaaa" maxlength="10" value="'+safe(displayDate(first))+'"></label><label>Până la<input name="leaveTo" placeholder="zz.ll.aaaa" maxlength="10" value="'+safe(displayDate(last))+'"></label></div><div><button type="button">Elimină perioada</button></div>';
    row.querySelector('button').onclick=()=>{settingsDirty=true;row.remove()};
    periods.append(row);
  }
  for(const entry of parts(p.off)){
    const [first,last=first]=entry.split(/\s*\/\s*/);
    addPeriod(first,last);
  }
  if(!periods.children.length)addPeriod();
  form.querySelector('#add-leave').onclick=()=>{settingsDirty=true;addPeriod()};
  form.theme.onchange=()=>document.documentElement.className=form.theme.value==='light'?'light':'';
  main.querySelector('#changePassword').onclick=()=>showPasswordForm(false);
  form.onsubmit=async e=>{
    e.preventDefault();
    const hours=days.map((_,i)=>({open:form['open'+i].checked,start:form['start'+i].value,end:form['end'+i].value}));
    function validInterval(line){
      const slots=line.split(/[–-]/).map(s=>s.trim());
      return slots.length===2&&slots.every(s=>times.some(([value])=>value===s))&&slots[1]>slots[0];
    }
    const off=[];
    for(const row of periods.children){
      const first=row.querySelector('[name=leaveFrom]').value.trim();
      const last=row.querySelector('[name=leaveTo]').value.trim();
      if(!first&&!last)continue;
      const dates=[first,last].map(value=>value.split('.').reverse().join('-'));
      if(!/^\d{2}\.\d{2}\.\d{4}$/.test(first)||!/^\d{2}\.\d{2}\.\d{4}$/.test(last)||!dates.every(validCalendarDate)||dates[0]>dates[1]){
        form.querySelector('.error').textContent='Completează ambele date în formatul zz.ll.aaaa. Data de început trebuie să fie cel târziu în ziua de sfârșit.';
        return;
      }
      off.push(dates.join(' / '));
    }
    const bad=hours.some(h=>h.open&&h.start>=h.end)||parts(form.pauses.value).some(s=>!validInterval(s));
    if(bad){form.querySelector('.error').textContent='Verifică datele și intervalele. Orele trebuie să respecte pasul de 15 minute.';return}
    const settings={duration:Number(form.duration.value),theme:form.theme.value,services:form.services.value,pauses:form.pauses.value,off:off.join('\n'),hours};
    const alias=form.display.value.trim();
    e.submitter.disabled=true;
    const {error}=await database.from('profiles').update({alias,settings}).eq('user_id',user).select('user_id').single();
    e.submitter.disabled=false;
    if(error){form.querySelector('.error').textContent='Setările nu s-au putut salva.';return}
    model.prefs={...settings,name:alias};settingsDirty=false;render();notice('Setări salvate');
  };
}
function restoreUpdatedView(id){
  try{
    const view=JSON.parse(sessionStorage.getItem(resumeKey));
    sessionStorage.removeItem(resumeKey);
    if(view?.user!==id||!['today','calendar','history','settings'].includes(view.screen))return;
    screen=view.screen;
    if(validCalendarDate(view.day))day=view.day;
    weekly=view.weekly===true;
  }catch{}
}
function canReloadApp(){
  return !modal.open && !settingsDirty && !location.hash && !recovery &&
    !app.querySelector('#login input[name="user"]')?.value &&
    !app.querySelector('#login input[name="password"]')?.value;
}
async function checkAppUpdate(){
  if(checkingVersion||!canReloadApp())return false;
  checkingVersion=true;
  try{
    const url=new URL(appUrl);
    url.searchParams.set('refresh',Date.now());
    const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(7000)});
    if(!response.ok)return false;
    const html=await response.text();
    const newest=html.match(/<meta name="anonymous-version" content="(\d+\.\d+\.\d+)">/)?.[1];
    if(!newest||newest.localeCompare(appVersion,'en',{numeric:true})<=0||!canReloadApp())return false;
    if(user){
      try{sessionStorage.setItem(resumeKey,JSON.stringify({user,screen,day,weekly}))}catch{}
    }
    location.replace(url.href);
    return true;
  }catch{return false}
  finally{checkingVersion=false}
}
async function refreshAgenda(onLoading){
  if(refreshing||modal.open||settingsDirty)return false;
  refreshing=true;
  try{
    onLoading?.();
    if(await checkAppUpdate())return false;
    if(!user){
      if(canReloadApp()){
        const url=new URL(appUrl);
        url.searchParams.set('refresh',Date.now());
        location.replace(url.href);
      }
      return false;
    }
    const {data,error}=await authClient.auth.getSession();
    if(error||!data.session)throw new Error('Sesiune indisponibilă');
    return await loadAccount(data.session,{refresh:true});
  }finally{refreshing=false}
}
function bindPullRefresh(){
  if(navigator.maxTouchPoints<1)return;
  const indicator=document.createElement('div');
  indicator.id='pull-refresh';
  indicator.hidden=true;
  indicator.setAttribute('role','status');
  indicator.innerHTML='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 11.5-1L20 9M4 15l2.5 3A7 7 0 0 0 18 17"/></svg><span></span>';
  document.body.append(indicator);
  const label=indicator.querySelector('span');
  const threshold=88;
  let start,distance=0,hideTimer;
  const scroller=()=>app.querySelector('.frame') || app;
  const atTop=()=>scroller().scrollTop<=1;
  const blocked=()=>refreshing || document.hidden || modal.open || settingsDirty;
  function reset(){
    start=null;distance=0;
    if(!refreshing){clearTimeout(hideTimer);indicator.hidden=true}
  }
  function show(state,message){
    const header=app.querySelector('header');
    indicator.style.setProperty('--agenda-header-bottom',(header?.getBoundingClientRect().bottom ?? 4)+'px');
    indicator.dataset.state=state;label.textContent=message;indicator.hidden=false;
  }
  document.addEventListener('touchstart',event=>{
    reset();
    if(blocked()||!atTop()||event.touches.length!==1||(window.visualViewport?.scale||1)>1)return;
    if(event.target.closest?.('header,nav,input,textarea,select,form,dialog,[contenteditable]'))return;
    const touch=event.touches[0];start={x:touch.clientX,y:touch.clientY};
  },{passive:true});
  document.addEventListener('touchmove',event=>{
    if(!start)return;
    if(blocked()||!atTop()||event.touches.length!==1||!event.cancelable){reset();return}
    const {clientX,clientY}=event.touches[0];
    const dy=clientY-start.y;
    if(dy<0||(!distance&&Math.abs(clientX-start.x)>Math.max(8,dy))){reset();return}
    if(dy<4&&!distance)return;
    event.preventDefault();
    distance=dy;
    const ready=distance>=threshold;
    show(ready?'ready':'pull',ready?'Eliberează pentru actualizare':'Trage în jos pentru actualizare');
  },{passive:false});
  document.addEventListener('touchend',async event=>{
    const run=!event.touches.length&&distance>=threshold&&!blocked()&&atTop();
    reset();
    if(!run)return;
    try{
      const updated=await refreshAgenda(()=>show('loading','Se actualizează…'));
      if(updated)show('done','Agenda a fost actualizată');
      else indicator.hidden=true;
    } catch {show('done','Actualizarea nu a reușit')}
    finally {hideTimer=setTimeout(reset,1400)}
  },{passive:true});
  document.addEventListener('touchcancel',reset,{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()});
}

login();
bindPullRefresh();
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!refreshing)void checkAppUpdate();
});
if(authClient){
  const linkType=new URLSearchParams(location.hash.slice(1)).get('type');
  recovery=linkType==='recovery'||linkType==='invite'||new URLSearchParams(location.search).get('type')==='invite';
  authClient.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY') recovery=true;
    if(event==='INITIAL_SESSION' || event==='PASSWORD_RECOVERY'){
      if(!session) return;
      setTimeout(()=>{
        if(recovery){if(!modal.open)showPasswordForm(true);return}
        loadAccount(session).catch(error=>notice(error.message));
      },0);
    }
  });
}
</script></body></html>
